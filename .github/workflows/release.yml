name: Release

# Собирает exe для Windows 7 и новее и создаёт релиз с файлами.
# Запуск: пуш тега вида v0.1.0 или вручную (Actions → Release → Run workflow) с указанием версии;
# при ручном запуске тег создаётся на текущем коммите ветки.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Установить MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Собрать exe (x64 и x86)
        run: ./scripts/build-windows.sh

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # В описание релиза попадает только раздел этой версии из CHANGELOG.md.
          awk -v version="${TAG#v}" '$0 ~ "^## \\[" version "\\]" {f=1; next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag_option=(--target "$GITHUB_SHA")
          else
            tag_option=(--verify-tag)
          fi
          gh release create "$TAG" dist/* \
            --title "Univ-antv $TAG" \
            --notes-file release-notes.md \
            "${tag_option[@]}"
